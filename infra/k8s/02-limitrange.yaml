apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: expendedora
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "150m"
        memory: "128Mi"
      max:
        cpu: "300m"
        memory: "256Mi"
