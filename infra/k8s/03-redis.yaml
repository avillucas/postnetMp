apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: expendedora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Memoria acotada y sin persistencia en disco: broker/backend liviano
          # para Celery, apto para el nodo e2-micro.
          args: ["--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "150m"
              memory: "150Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: expendedora
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
